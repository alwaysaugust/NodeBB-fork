version: '3.8'

services:
  nodebb:
    build: .
    restart: unless-stopped
    ports:
      - "4567:4567/tcp" # comment this out if you don't want to expose NodeBB to the host, or change the first number to any port you want
    # uncomment if you want to use another container as a reverse proxy
    # expose:
    #   - 4567
    volumes:
      - ./.docker/build:/usr/src/app/build
      - ./.docker/public/uploads:/usr/src/app/public/uploads
      - ./.docker:/opt/config
      - ./install/docker/setup.json:/usr/src/app/setup.json
    environment:      # Move the MongoDB environment variables here
      MONGO_INITDB_ROOT_USERNAME: ttr
      MONGO_INITDB_ROOT_PASSWORD: your_atlas_password
      MONGO_INITDB_DATABASE: ttr-dev
      MONGODB_URL: "mongodb+srv://ttr-dev.5nxhwip.mongodb.net/?retryWrites=true&w=majority"

  redis:
    image: redis:7.2.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    # command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"] # uncomment if you want to use snapshotting instead of AOF
    expose:
      - "6379"
    volumes:
      - ./.docker/database/redis:/data
    profiles:
      - redis